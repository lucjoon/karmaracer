# fly.toml app configuration file generated for Karma Racer
app = "karmaracer"
primary_region = "cdg"

[build]

[env]
  NODE_ENV = "production"
  KARMA_GUEST_MODE = "1"
  KARMA_MEMORY_DB = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
